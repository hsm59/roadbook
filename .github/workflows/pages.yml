# Deploys the PWA to GitHub Pages on every push to main.
#
# Only the runtime files are published. The Dockerfile, nginx config and
# tools/ are how the app is built and deployed elsewhere; they are not part
# of the site, so they are not uploaded.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-deployed
# service worker is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the runtime files
        run: |
          mkdir -p _site
          cp index.html app.js sheet.js weather.js sw.js precache.js route-data.js _site/
          cp manifest.webmanifest icon.svg .nojekyll _site/
          cp -R vendor downloads _site/

      - name: Check the service worker can cache everything it lists
        run: node .github/scripts/check-shell-assets.mjs _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
