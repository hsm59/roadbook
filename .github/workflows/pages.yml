# Deploys the PWA to GitHub Pages on every push to main.
#
# Only the runtime files are published. The Dockerfile, nginx config and
# tools/ are how the app is built and deployed elsewhere; they are not part
# of the site, so they are not uploaded.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-deployed
# service worker is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the runtime files
        run: |
          mkdir -p _site
          cp index.html app.js sheet.js weather.js sw.js precache.js route-data.js _site/
          cp manifest.webmanifest icon.svg .nojekyll _site/
          cp -R vendor downloads _site/

      # The shell cache is keyed on VERSION. Ship two deploys with the same
      # value and the second installs into the cache that already exists, so
      # every device keeps serving the old code and nothing — not the browser,
      # not the update button — can tell that a new build happened. Stamping
      # the commit makes that impossible to forget.
      - name: Stamp the build version into the service worker
        run: |
          set -euo pipefail
          sed -i -E "s/^const VERSION[[:space:]]*=.*$/const VERSION     = \"${GITHUB_SHA::7}\";/" _site/sw.js
          grep -q "const VERSION     = \"${GITHUB_SHA::7}\";" _site/sw.js \
            || { echo "VERSION was not stamped — has the line in sw.js been reformatted?"; exit 1; }
          grep -n "const VERSION" _site/sw.js

      - name: Check the service worker can cache everything it lists
        run: node .github/scripts/check-shell-assets.mjs _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
